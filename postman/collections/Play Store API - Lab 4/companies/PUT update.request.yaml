$kind: http-request
description: "Full update. Required: company_name, contact_email, developer_id."
url: "{{base_url}}/companies/:company_id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  company_id: "1"
body:
  type: json
  content: |-
    {
      "company_name": "Nova Labs",
      "contact_email": "support@novalabs.example.com",
      "developer_id": 1
    }
order: 4000
