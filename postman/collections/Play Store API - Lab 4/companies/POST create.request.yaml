$kind: http-request
description: "Create a company. Required: company_name, developer_id. contact_email is optional and may be null."
url: "{{base_url}}/companies"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "company_name": "Example Soft",
      "contact_email": "dev@example.com",
      "developer_id": 1
    }
order: 3000
