$kind: http-request
description: "Full update. Required: device_id, app_version_id."
url: "{{base_url}}/installations/:installation_id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  installation_id: "1"
body:
  type: json
  content: |-
    {
      "device_id": 1,
      "app_version_id": 2
    }
order: 4000
