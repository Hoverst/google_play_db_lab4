$kind: http-request
description: "Full update. All writable fields required: email, password, name."
url: "{{base_url}}/accounts/:account_id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  account_id: "1"
body:
  type: json
  content: |-
    {
      "email": "olena.kovalenko@example.com",
      "password": "demo_password_1",
      "name": "Olena Kovalenko"
    }
order: 4000
