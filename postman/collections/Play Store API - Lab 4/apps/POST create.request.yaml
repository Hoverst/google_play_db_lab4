$kind: http-request
description: "Create an app. Required: title, package_name, company_id. Optional: caption, status."
url: "{{base_url}}/apps"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Example App",
      "package_name": "com.example.app",
      "caption": "A sample application",
      "company_id": 1,
      "status": "published"
    }
order: 3000
