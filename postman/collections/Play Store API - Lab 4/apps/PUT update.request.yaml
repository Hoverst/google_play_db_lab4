$kind: http-request
description: "Full update. Required: title, package_name, caption, company_id, status."
url: "{{base_url}}/apps/:app_id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  app_id: "1"
body:
  type: json
  content: |-
    {
      "title": "Nova Notes",
      "package_name": "com.novalabs.notes",
      "caption": "Fast notes and syncing",
      "company_id": 1,
      "status": "published"
    }
order: 4000
