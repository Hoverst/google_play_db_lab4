$kind: http-request
description: "Full update. Required: rating, comment."
url: "{{base_url}}/reviews/:review_id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  review_id: "1"
body:
  type: json
  content: |-
    {
      "rating": 5.0,
      "comment": "Excellent"
    }
order: 4000
