$kind: http-request
description: "Create a review. Required: account_id, app_id, rating. Optional: comment. Requires an existing library entry for the same (account_id, app_id) - run 'library > POST create' first."
url: "{{base_url}}/reviews"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "account_id": 1,
      "app_id": 1,
      "rating": 4.5,
      "comment": "Great app"
    }
order: 3000
